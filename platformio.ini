; Desk Display firmware for Waveshare ESP32-S3-Touch-AMOLED-2.16
[env:amoled216]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLV_CONF_INCLUDE_SIMPLE
    -I src
    -DCORE_DEBUG_LEVEL=1
lib_ldf_mode = deep
lib_deps = Network, WiFi
extra_scripts = pre:tools/embed_www.py
