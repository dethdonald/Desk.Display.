<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>Desk Display</title>
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="/favicon.svg">
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot" id="connDot"></span><span id="devName">Desk Display</span></div>
  <div class="chips" id="chips"></div>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="dash" class="active">Dashboard</button>
  <button data-tab="layout">Layout</button>
  <button data-tab="media">Media</button>
  <button data-tab="controls">Controls</button>
  <button data-tab="settings">Settings</button>
  <button data-tab="maint">Maintenance</button>
  <button data-tab="update">Update</button>
</nav>
<main>
  <section id="tab-dash" class="tab active"></section>
  <section id="tab-layout" class="tab"></section>
  <section id="tab-media" class="tab"></section>
  <section id="tab-controls" class="tab"></section>
  <section id="tab-settings" class="tab"></section>
  <section id="tab-maint" class="tab"></section>
  <section id="tab-update" class="tab"></section>
</main>
<div id="toast" class="toast"></div>
<script src="/app.js"></script>
</body>
</html>
